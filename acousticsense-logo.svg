<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
  </defs>
  <!-- Outer circle ring -->
  <circle cx="50" cy="50" r="46" fill="#14171a" stroke="#38424e" stroke-width="4"/>
  <!-- Acoustic wave bars -->
  <rect x="22" y="44" width="6" height="12" rx="3" fill="#ff7700"/>
  <rect x="33" y="32" width="6" height="36" rx="3" fill="#ffaa00"/>
  <rect x="44" y="20" width="6" height="60" rx="3" fill="#00e5ff"/>
  <rect x="55" y="28" width="6" height="44" rx="3" fill="#ffaa00"/>
  <rect x="66" y="38" width="6" height="24" rx="3" fill="#ff7700"/>
  <!-- Central pulse dot -->
  <circle cx="50" cy="50" r="3" fill="#ffffff"/>
</svg>
